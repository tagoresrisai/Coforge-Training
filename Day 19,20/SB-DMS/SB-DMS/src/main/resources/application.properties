spring.application.name=SpringBoot-DMS

#embedded tomcat port number
server.port=1235

#Database connection properties
spring.datasource.url=jdbc:mysql://localhost:3306/coforge
spring.datasource.username=root
spring.datasource.password=Password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Application Properties
dms.save.success="SUCCESS : Department Details Inserted"

dms.db.failed="FAILED : DB Error"

dms.save.fail="FAILED : Invalid Department Details"

dms.update.success="SUCCESS : Department Object Updated"

dms.delete.success="SUCCESS : Department Object Deleted"

dms.find.success="SUCCESS : Department Details Found"

dms.invalid.department-details="FAILED : Invalid Department Details"

dms.invalid.department-notfound="FAILED : Department Details not found"

eureka.instance.hostname=localhost

#Stop registering as a client. It is a Server
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true