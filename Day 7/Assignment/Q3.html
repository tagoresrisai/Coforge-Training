<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        table{
            width:80%;
            margin:auto;
            border-collapse:collapse;
        }

        th, td{
            border:2px solid black;
            padding:10px;
        }

        h1{
            text-align:center;
        }

        input, textarea{
            width:200px;
            padding:5px;
        }

        textarea{
            resize:none;
        }

        .gender input{
            width:auto;
        }

        .submit{
            width:auto;
        }
    </style>
</head>

<body>

<form>

<table>

<tr>
    <th colspan="2"><h1>Registration Form</h1></th>
</tr>

<tr>
    <td>Student Name</td>
    <td><input type="text" name="sname"></td>
</tr>

<tr>
    <td>Father's Name</td>
    <td><input type="text" name="fname"></td>
</tr>

<tr>
    <td>Mother's Name</td>
    <td><input type="text" name="mname"></td>
</tr>

<tr>
    <td>Date of Birth</td>
    <td><input type="date" name="dob"></td>
</tr>

<tr>
    <td>Gender</td>
    <td class="gender">
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </td>
</tr>

<tr>
    <td>Email ID</td>
    <td><input type="email" name="email"></td>
</tr>

<tr>
    <td>Mobile No.</td>
    <td><input type="tel" name="mobile"></td>
</tr>

<tr>
    <td>Address</td>
    <td><textarea rows="5" cols="30"></textarea></td>
</tr>

<tr>
    <td>State</td>
    <td><input type="text" name="state"></td>
</tr>

<tr>
    <td>City</td>
    <td><input type="text" name="city"></td>
</tr>

<tr>
    <td></td>
    <td>
        <input type="submit" value="Submit" class="submit">
    </td>
</tr>

</table>

</form>

</body>
</html>
