<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Grid Example</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .header{
            background-color:#4b74c0;
            color:white;
            text-align:center;
            font-size:50px;
            font-weight:bold;
            padding:30px;
            border-radius:20px;
            margin-top:20px;
        }

        .box{
            height:350px;
            border-radius:40px;
            text-align:center;
            font-size:40px;
            font-weight:bold;
            display:flex;
            justify-content:center;
            align-items:center;
            margin-top:20px;
        }

        .box1{
            background:#75b045;
        }

        .box2{
            background:#f57c2a;
        }

        .box3{
            background:#ffc107;
        }

        .footer{
            background:#5b95cf;
            text-align:center;
            font-size:30px;
            font-weight:bold;
            padding:10px;
            border-radius:10px;
            margin-top:20px;
        }
    </style>

</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="row">
        <div class="col-12">
            <div class="header">Header</div>
        </div>
    </div>

    <!-- Three Columns -->
    <div class="row">

        <div class="col-md-4">
            <div class="box box1">Column 1</div>
        </div>

        <div class="col-md-4">
            <div class="box box2">Column 2</div>
        </div>

        <div class="col-md-4">
            <div class="box box3">Column 3</div>
        </div>

    </div>

    <!-- Footer -->
    <div class="row">
        <div class="col-12">
            <div class="footer">Footer</div>
        </div>
    </div>

</div>

</body>
</html>
